<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329" />
      <stop offset="50%" stop-color="#080a14" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2046" />
      <stop offset="100%" stop-color="#10142e" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p2Bg)" />
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5" />

  <!-- Title Top Bar -->
  <g transform="translate(35, 28)">
    <rect width="530" height="42" rx="8" fill="#141938" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="21" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="'Segoe UI', monospace, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">workflow: .github/workflows/deploy.yml</text>
    <rect x="425" y="10" width="90" height="22" rx="6" fill="#10b981" opacity="0.2" />
    <text x="470" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">✓ Passing</text>
  </g>

  <!-- CI/CD Connecting Pipeline Pipe -->
  <path d="M 95 180 L 505 180" stroke="url(#pipelineGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 95 180 L 505 180" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 12" stroke-linecap="round" opacity="0.6" />

  <!-- Stage 1: Git Push (main) -->
  <g transform="translate(45, 110)">
    <rect width="110" height="140" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="55" cy="40" r="22" fill="#8b5cf6" opacity="0.2" />
    <text x="55" y="47" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">🐙</text>
    <text x="55" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">git push</text>
    <text x="55" y="102" font-family="'Courier New', monospace" font-size="10" fill="#a78bfa" text-anchor="middle">refs/heads/main</text>
    <rect x="20" y="115" width="70" height="16" rx="4" fill="#8b5cf6" opacity="0.3" />
    <text x="55" y="127" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ddd6fe" text-anchor="middle">Triggered</text>
  </g>

  <!-- Stage 2: Code Validation (CI) -->
  <g transform="translate(190, 110)">
    <rect width="110" height="140" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="55" cy="40" r="22" fill="#06b6d4" opacity="0.2" />
    <text x="55" y="47" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">🧪</text>
    <text x="55" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CI Validate</text>
    <text x="55" y="102" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Syntax &amp; Lint</text>
    <rect x="20" y="115" width="70" height="16" rx="4" fill="#0284c7" opacity="0.3" />
    <text x="55" y="127" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#bae6fd" text-anchor="middle">Verified ✓</text>
  </g>

  <!-- Stage 3: Artifact Upload (Build) -->
  <g transform="translate(335, 110)">
    <rect width="110" height="140" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" />
    <circle cx="55" cy="40" r="22" fill="#6366f1" opacity="0.2" />
    <text x="55" y="47" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">📦</text>
    <text x="55" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Pages Artifact</text>
    <text x="55" y="102" font-family="'Courier New', monospace" font-size="10" fill="#818cf8" text-anchor="middle">upload-pages</text>
    <rect x="20" y="115" width="70" height="16" rx="4" fill="#4f46e5" opacity="0.3" />
    <text x="55" y="127" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#c7d2fe" text-anchor="middle">Packaged</text>
  </g>

  <!-- Stage 4: GitHub Pages Deploy (CD) -->
  <g transform="translate(480, 110)">
    <rect width="90" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
    <circle cx="45" cy="40" r="22" fill="#10b981" opacity="0.2" />
    <text x="45" y="47" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">🌐</text>
    <text x="45" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Live CD</text>
    <text x="45" y="102" font-family="'Courier New', monospace" font-size="10" fill="#34d399" text-anchor="middle">GH-Pages</text>
    <rect x="10" y="115" width="70" height="16" rx="4" fill="#059669" opacity="0.3" />
    <text x="45" y="127" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Online 🚀</text>
  </g>

  <!-- Terminal Log at Bottom -->
  <g transform="translate(35, 275)">
    <rect width="530" height="55" rx="8" fill="#080c1d" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="18" y="24" font-family="'Courier New', monospace" font-size="11" fill="#10b981">&gt; deploy-pages@v4: Deployed to https://sindhuja.github.io/portfolio</text>
    <text x="18" y="42" font-family="'Courier New', monospace" font-size="10" fill="#64748b">&gt; Duration: 24s | Environment: github-pages | Status: Success (200 OK)</text>
  </g>
</svg>
