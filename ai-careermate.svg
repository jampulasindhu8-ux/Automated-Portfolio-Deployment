<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d2b" />
      <stop offset="50%" stop-color="#0a0a18" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p1Bg)" />
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Left Card: Resume & Skill Parser -->
  <g transform="translate(45, 60)">
    <rect width="220" height="240" rx="12" fill="#141738" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- Header -->
    <rect width="220" height="36" rx="12" fill="#1e2352" />
    <circle cx="20" cy="18" r="4.5" fill="#f43f5e" />
    <circle cx="36" cy="18" r="4.5" fill="#eab308" />
    <circle cx="52" cy="18" r="4.5" fill="#10b981" />
    <text x="75" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Resume Analysis</text>
    
    <!-- Skills parsed -->
    <rect x="20" y="55" width="80" height="20" rx="10" fill="#8b5cf6" opacity="0.3" />
    <text x="35" y="69" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#c084fc">Python</text>

    <rect x="110" y="55" width="80" height="20" rx="10" fill="#3b82f6" opacity="0.3" />
    <text x="125" y="69" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">Data Struct</text>

    <rect x="20" y="85" width="70" height="20" rx="10" fill="#06b6d4" opacity="0.3" />
    <text x="35" y="99" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">DevOps</text>

    <rect x="100" y="85" width="90" height="20" rx="10" fill="#10b981" opacity="0.3" />
    <text x="115" y="99" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#34d399">Cloud CI/CD</text>

    <!-- Match score gauge -->
    <circle cx="110" cy="170" r="40" fill="none" stroke="#252b5c" stroke-width="8" />
    <circle cx="110" cy="170" r="40" fill="none" stroke="url(#purpleGlow)" stroke-width="8" stroke-dasharray="210 50" stroke-linecap="round" />
    <text x="110" y="174" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">94%</text>
    <text x="110" y="225" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">SDE Role Alignment</text>
  </g>

  <!-- Connecting AI Neural Nodes in Center -->
  <g stroke="url(#cyanGlow)" stroke-width="2" opacity="0.8">
    <line x1="265" y1="140" x2="335" y2="110" stroke-dasharray="4 4" />
    <line x1="265" y1="180" x2="335" y2="180" />
    <line x1="265" y1="220" x2="335" y2="250" stroke-dasharray="4 4" />
  </g>

  <!-- Right Card: Recommended Career Roadmap -->
  <g transform="translate(335, 60)">
    <rect width="220" height="240" rx="12" fill="#141738" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect width="220" height="36" rx="12" fill="#1e2352" />
    <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">AI Roadmap Output</text>
    
    <!-- Milestones -->
    <circle cx="28" cy="70" r="10" fill="#10b981" />
    <text x="25" y="74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">✓</text>
    <text x="48" y="74" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Core Java &amp; Python</text>

    <line x1="28" y1="80" x2="28" y2="115" stroke="#334155" stroke-width="2" />

    <circle cx="28" cy="125" r="10" fill="#8b5cf6" />
    <circle cx="28" cy="125" r="4" fill="#ffffff" />
    <text x="48" y="129" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c084fc">DSA &amp; System Design</text>

    <line x1="28" y1="135" x2="28" y2="170" stroke="#334155" stroke-width="2" />

    <circle cx="28" cy="180" r="10" fill="#3b82f6" />
    <text x="48" y="184" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#93c5fd">CI/CD &amp; Cloud Deploy</text>

    <!-- Bottom Action Badge -->
    <rect x="20" y="205" width="180" height="24" rx="6" fill="url(#cyanGlow)" />
    <text x="110" y="221" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ AI Pathway Active</text>
  </g>
</svg>
