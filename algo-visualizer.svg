<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#070c1e" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>
    <linearGradient id="barActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="barSorted" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="barNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p3Bg)" />
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5" />

  <!-- Top Controller Bar -->
  <g transform="translate(30, 25)">
    <rect width="540" height="46" rx="8" fill="#13193a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <!-- Algorithm selector -->
    <rect x="15" y="10" width="120" height="26" rx="6" fill="#8b5cf6" />
    <text x="75" y="27" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Quick Sort</text>

    <!-- Speed slider mockup -->
    <text x="155" y="27" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Speed:</text>
    <rect x="200" y="21" width="80" height="4" rx="2" fill="#334155" />
    <circle cx="250" cy="23" r="6" fill="#38bdf8" />

    <!-- Array size -->
    <text x="300" y="27" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Size: 24</text>

    <!-- Stats -->
    <rect x="365" y="10" width="160" height="26" rx="6" fill="#1e293b" />
    <text x="445" y="26" font-family="'Courier New', monospace" font-size="10.5" fill="#10b981" text-anchor="middle">O(N log N) | Comp: 68</text>
  </g>

  <!-- Array Sorting Bars Visualizer -->
  <g transform="translate(40, 95)">
    <!-- Baseline -->
    <line x1="0" y1="180" x2="520" y2="180" stroke="#334155" stroke-width="1" />

    <!-- Sorted Bars -->
    <rect x="10" y="150" width="14" height="30" rx="3" fill="url(#barSorted)" />
    <rect x="30" y="130" width="14" height="50" rx="3" fill="url(#barSorted)" />
    <rect x="50" y="115" width="14" height="65" rx="3" fill="url(#barSorted)" />
    <rect x="70" y="90" width="14" height="90" rx="3" fill="url(#barSorted)" />

    <!-- In Progress Bars -->
    <rect x="90" y="60" width="14" height="120" rx="3" fill="url(#barNormal)" />
    <rect x="110" y="80" width="14" height="100" rx="3" fill="url(#barNormal)" />
    <rect x="130" y="45" width="14" height="135" rx="3" fill="url(#barNormal)" />
    <rect x="150" y="110" width="14" height="70" rx="3" fill="url(#barNormal)" />

    <!-- Comparing / Swapping (Active Red/Pink) -->
    <rect x="170" y="30" width="14" height="150" rx="3" fill="url(#barActive)" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="190" y="125" width="14" height="55" rx="3" fill="url(#barActive)" stroke="#f43f5e" stroke-width="1.5" />
    <path d="M 177 20 Q 187 10 197 20" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
    <text x="187" y="10" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#f43f5e" text-anchor="middle">SWAP</text>

    <!-- Normal Bars -->
    <rect x="210" y="70" width="14" height="110" rx="3" fill="url(#barNormal)" />
    <rect x="230" y="50" width="14" height="130" rx="3" fill="url(#barNormal)" />
    <rect x="250" y="100" width="14" height="80" rx="3" fill="url(#barNormal)" />
    <rect x="270" y="20" width="14" height="160" rx="3" fill="url(#barNormal)" />
    <rect x="290" y="85" width="14" height="95" rx="3" fill="url(#barNormal)" />
    <rect x="310" y="135" width="14" height="45" rx="3" fill="url(#barNormal)" />
    <rect x="330" y="65" width="14" height="115" rx="3" fill="url(#barNormal)" />
    <rect x="350" y="40" width="14" height="140" rx="3" fill="url(#barNormal)" />
    <rect x="370" y="120" width="14" height="60" rx="3" fill="url(#barNormal)" />
    <rect x="390" y="95" width="14" height="85" rx="3" fill="url(#barNormal)" />
    <rect x="410" y="145" width="14" height="35" rx="3" fill="url(#barNormal)" />
    <rect x="430" y="75" width="14" height="105" rx="3" fill="url(#barNormal)" />
    <rect x="450" y="110" width="14" height="70" rx="3" fill="url(#barNormal)" />
    <rect x="470" y="55" width="14" height="125" rx="3" fill="url(#barNormal)" />
    <rect x="490" y="35" width="14" height="145" rx="3" fill="url(#barNormal)" />
  </g>

  <!-- Legend at Bottom -->
  <g transform="translate(140, 310)">
    <circle cx="10" cy="10" r="5" fill="#10b981" />
    <text x="22" y="14" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Sorted Array</text>

    <circle cx="120" cy="10" r="5" fill="#ec4899" />
    <text x="132" y="14" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Active Pivot/Swap</text>

    <circle cx="260" cy="10" r="5" fill="#8b5cf6" />
    <text x="272" y="14" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Unsorted Elements</text>
  </g>
</svg>
